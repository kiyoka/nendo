name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '2.3'
          - '2.4'
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - 'head'
    continue-on-error: ${{ matrix.ruby-version == 'head' }}

    env:
      NENDO_CLEAN_TEST: "0"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Debug environment
      run: |
        echo "Ruby version: ${{ matrix.ruby-version }}"
        echo "NENDO_CLEAN_TEST: $NENDO_CLEAN_TEST"
        bundle exec rake --version
        bundle exec rake --tasks | head -10

    - name: Run test1
      run: bundle exec rake test1

    - name: Run test2
      run: bundle exec rake test2

    - name: Run test3
      run: bundle exec rake test3
      continue-on-error: true