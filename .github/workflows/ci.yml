name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '2.0'
          - '2.1'
          - '2.2'
          - '2.3'
          - '2.4'
          - '3.2.3'
          - 'jruby'
          - 'head'
        env:
          - NENDO_CLEAN_TEST=0
        include:
          - ruby-version: 'head'
            continue-on-error: true

    env:
      NENDO_CLEAN_TEST: ${{ matrix.env }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
        working-directory: ./gemfiles

    - name: Install dependencies
      run: |
        cd gemfiles
        bundle install

    - name: Run tests
      run: |
        cd gemfiles
        bundle exec rake
      continue-on-error: ${{ matrix.ruby-version == 'head' }}