name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '2.3'
          - '2.4'
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - 'head'
    continue-on-error: ${{ matrix.ruby-version == 'head' }}

    env:
      NENDO_CLEAN_TEST: "0"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Debug environment
      run: |
        echo "Ruby version: ${{ matrix.ruby-version }}"
        echo "NENDO_CLEAN_TEST: $NENDO_CLEAN_TEST"
        bundle exec rake --version
        pwd
        ls -la

    - name: Run simple Ruby test
      run: |
        ruby -I ./lib -e "require 'nendo'; puts 'Nendo loaded successfully'"

    - name: Run RSpec tests only
      run: bundle exec rspec -I ./lib spec/*_spec.rb

    - name: Run SRFI-1 test only
      run: ruby -I ./lib ./bin/nendo ./spec/srfi-1-test.nnd